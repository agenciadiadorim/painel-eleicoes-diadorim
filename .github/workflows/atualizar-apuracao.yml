name: Atualizar apuração

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: atualizar-apuracao
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coletar resultados oficiais e alertar eleitas
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node atualizar-tse.mjs
      - run: |
          git add painel.json
          test ! -f alertas-slack-enviados.json || git add alertas-slack-enviados.json
          git diff --cached --quiet || git -c user.name='Agência Diadorim' -c user.email='contato@adiadorim.org' commit -m 'Atualiza apuração do TSE'
          git push
